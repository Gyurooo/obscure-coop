[obscoop]
; Guest: your friend plays player 2 in the host's game.
ROLE=guest
NET=steam
; Your controller (XInput pad 1 = 0). It is sent to the host; your own game does not see it.
LOCAL_PAD=0
HIDE_REAL_PADS=0
; Optional: the host's 17-digit Steam ID. Empty = find the friend who is playing Obscure.
HOST_STEAMID=
; Supersampling (graphics, your PC only): 1 = off, 2 = the game renders at twice the width and height
; and shrinks it for sharper image and smoother edges (menu text shows smaller), 4 = four times.
; Fullscreen becomes a borderless window. Does not need to match the host.
SSAA=2
; Texture filtering (your PC only): 0 = the game's own, 2..16 = anisotropic (sharper surfaces at an angle).
ANISO=16
; Text size with supersampling: empty = same as SSAA (text looks as without SSAA), e.g. 1.5 = smaller,
; 1 = the old tiny text.
TEXT_SCALE=
; 16:9 widescreen (your PC only): 1 = fill a 16:9 screen with a wider view (default), 0 = the original 4:3
; picture with black bars at the sides.
WIDESCREEN=1
